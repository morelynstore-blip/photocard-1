<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Importa a biblioteca A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- Importa o MindAR para A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    /* Estilo do botão para liberar o vídeo/áudio no celular */
    #play-btn {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      padding: 14px 28px;
      background-color: #000;
      color: #fff;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- Botão para liberar o áudio e a reprodução automática no iOS/Android -->
  <button id="play-btn">Toque para Ativar AR</button>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <!-- 
        NOVIDADE: 'crossorigin="anonymous"' corrigido para evitar o quadrado preto.
        Certifique-se de que o arquivo no GitHub se chama exatamente "video1.mp4"
      -->
      <video 
        id="video1" 
        src="./video1.mp4" 
        crossorigin="anonymous" 
        preload="auto" 
        loop 
        webkit-playsinline 
        playsinline>
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Photocard 1 (Aponte para a 1ª foto do targets.mind) -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-video src="#video1" width="1" height="1.5" position="0 0 0"></a-video>
    </a-entity>

  </a-scene>

  <script>
    const playBtn = document.querySelector('#play-btn');
    const videos = document.querySelectorAll('video');

    playBtn.addEventListener('click', () => {
      // Toca todos os vídeos para pré-carregar as permissões do navegador
      videos.forEach(video => {
        video.play().catch(err => console.log('Aguardando interação:', err));
      });
      // Esconde o botão após o clique
      playBtn.style.display = 'none';
    });
  </script>
</body>
</html>
